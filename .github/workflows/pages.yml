name: Deploy web to GitHub Pages

# Сайт живёт на VPS (см. web-build.yml), а GitHub Pages в репозитории не включён,
# поэтому публикуем на Pages только вручную: Actions → Deploy web to GitHub Pages → Run workflow.
# Чтобы публиковать автоматически, включите Pages (Settings → Pages → Source: GitHub Actions)
# и верните триггер:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
