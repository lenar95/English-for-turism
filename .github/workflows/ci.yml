name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Тесты и сборка веб-версии
    # На пуш проверяем любую ветку. PR из этого же репозитория уже проверен пушем в его ветку,
    # поэтому по событию pull_request запускаемся только для PR из форков.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  ios:
    name: Сборка iOS (симулятор)
    # macOS-раннер медленный и дорогой: iOS собираем только для main и pull request'ов.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: xcodebuild
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
